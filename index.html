&lt;style&gt;
#mail-flight { max-width:650px; margin:0 auto; color:var(--foreground); }
#mail-flight [hidden] {display:none!important;}
#mail-flight .study-heading {display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
#mail-flight .phone-stage {background:#efeeeb;padding:28px 34px 38px;}
#mail-flight .mail-pair {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:38px;}
#mail-flight .mail-example {min-width:0;}
#mail-flight .app-caption {display:flex;justify-content:center;align-items:center;margin-bottom:15px;color:#525256;font:500 13px/1.4 system-ui,sans-serif;letter-spacing:.15px;}
#mail-flight .iphone-frame {position:relative;padding:8px;border:2px solid #939398;border-radius:39px;background:#101113;box-shadow:inset 0 0 0 2px #38393c,0 2px 0 #bfc0c1,0 18px 26px -12px #2a2a343d,0 4px 7px #0002;}
#mail-flight .side-button {position:absolute;left:-4px;width:3px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#929395,#35363a);}
#mail-flight .action-button {top:15%;height:18px;}
#mail-flight .volume-up {top:22%;height:34px;}
#mail-flight .volume-down {top:30%;height:34px;}
#mail-flight .power-button {left:auto;right:-4px;top:26%;height:51px;border-radius:0 2px 2px 0;}
#mail-flight .mail-screen {position:relative;isolation:isolate;background:#fff;border-radius:29px;overflow:hidden;--ink:#1877dc;--paper-light:#87bcff;--paper-mid:#3f91f1;--paper-dark:#0b56b5;--send-x:80.3%;--send-y:10.207%;}
#mail-flight .apple-screen {--ink:#00a2f0;--paper-light:#82e0ff;--paper-mid:#00a6f5;--paper-dark:#0077cc;--send-x:90.5%;--send-y:11.569%;}
#mail-flight .dynamic-island {position:absolute;left:34.5%;top:1.35%;width:31%;height:3.5%;background:#08090b;border-radius:20px;z-index:6;pointer-events:none;}
#mail-flight .dynamic-island span {position:absolute;right:7%;top:25%;height:50%;aspect-ratio:1;background:radial-gradient(circle at 40% 40%,#20304a,#08090c 65%);border-radius:50%;}
#mail-flight .home-indicator {position:absolute;bottom:1.2%;left:32%;width:36%;height:4px;border-radius:8px;background:#090909;z-index:4;pointer-events:none;}
#mail-flight .screen-reference {display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;}
#mail-flight .send-hit {position:absolute;left:var(--send-x);top:var(--send-y);transform:translate(-50%,-50%);width:44px;height:44px;padding:0;background:transparent;border:0;border-radius:50%;z-index:3;}
#mail-flight .send-hit:focus-visible {outline:3px solid var(--ink);outline-offset:3px;}
#mail-flight .send-mask {position:absolute;inset:0;background:#fff;border-radius:50%;opacity:0;}
#mail-flight .is-active .send-mask {opacity:1;}
#mail-flight .demo-cursor {position:absolute;left:var(--send-x);top:var(--send-y);margin:-4px 0 0 -4px;width:28px;height:28px;z-index:8;pointer-events:none;opacity:0;transform-origin:4px 4px;filter:drop-shadow(0 2px 2px #0005);}
#mail-flight .demo-cursor svg {width:28px;height:28px;fill:#17191d;stroke:#fff;stroke-width:1.6px;}
#mail-flight .click-ripple {position:absolute;left:var(--send-x);top:var(--send-y);width:36px;height:36px;margin:-18px 0 0 -18px;border:2px solid var(--ink);border-radius:50%;box-sizing:border-box;z-index:7;pointer-events:none;opacity:0;}
#mail-flight .plane-rig {position:absolute;left:var(--send-x);top:var(--send-y);width:80px;height:52px;margin:-26px 0 0 -40px;pointer-events:none;z-index:5;opacity:0;perspective:500px;}
#mail-flight .paper-plane {position:absolute;inset:0;transform-style:preserve-3d;filter:drop-shadow(0 4px 3px #00346b26);}
#mail-flight .paper-face {position:absolute;inset:0;backface-visibility:visible;}
#mail-flight .left-wing {background:var(--paper-light);clip-path:polygon(0 0,50% 0,50% 100%,0 100%);}
#mail-flight .keel {background:var(--paper-dark);clip-path:polygon(40% 0,60% 0,60% 100%,40% 100%);}
#mail-flight .right-wing {background:var(--paper-mid);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%);}
#mail-flight .paper-label {position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:500 16px/1 system-ui,sans-serif;letter-spacing:.2px;}
#mail-flight .paper-shadow {position:absolute;inset:22px 0 -15px;background:#1558a733;filter:blur(9px);border-radius:50%;transform:scale(.8,.25);}
#mail-flight .sent-toast {position:absolute;left:5%;right:5%;bottom:7%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;background:#252729;color:#fff;border-radius:12px;font:400 14px/1.3 system-ui,sans-serif;box-shadow:0 8px 24px #0002;opacity:0;transform:translateY(12px);transition:opacity 180ms,transform 250ms;pointer-events:none;}
#mail-flight .sent-toast {visibility:hidden;}
#mail-flight .is-sent .sent-toast {visibility:visible;opacity:1;transform:translateY(0);pointer-events:auto;}
#mail-flight .undo {font:500 14px/1.3 system-ui,sans-serif;padding:5px 0;background:none;color:#a7ceff;border:0;}
#mail-flight .playback-controls {display:flex;justify-content:center;gap:16px;margin-top:12px;}
#mail-flight .example-footer,#mail-flight .study-footer {display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;}
#mail-flight .example-footer {font-size:12px;}
#mail-flight .study-footer {margin-top:22px;color:var(--muted-foreground);font-size:12px;}
#mail-flight a {color:inherit;text-decoration:underline;text-underline-offset:3px;}
#mail-flight .motion-status {color:var(--muted-foreground);}
@media(max-width:560px){#mail-flight .mail-pair{grid-template-columns:1fr;gap:30px;}#mail-flight .mail-example{width:min(100%,280px);margin:auto;}#mail-flight .phone-stage{padding:26px 20px 36px;}#mail-flight .study-heading{justify-content:center;}#mail-flight .study-footer{justify-content:center;}}
@media(prefers-reduced-motion:reduce){#mail-flight *,#mail-flight *::before,#mail-flight *::after{transition:none!important;}}
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
const root = document.getElementById(&#x27;mail-flight&#x27;);

const enabled = root.querySelector(&#x27;#enable-flight&#x27;);
const playBoth = root.querySelector(&#x27;#play-both&#x27;);
